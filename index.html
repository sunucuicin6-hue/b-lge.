<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Derin Araştırma</title>
<style>
  :root {
    --bg: #0e0f0c;
    --bg-panel: #16180f;
    --ink: #e9e6d8;
    --ink-dim: #9a9686;
    --accent: #b8c15a;
    --line: #2a2c20;
    --serif: "Iowan Old Style", "Georgia", serif;
    --mono: "IBM Plex Mono", "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--serif);
    line-height: 1.55;
  }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 64px 24px 120px;
  }
  h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 2.4rem;
    letter-spacing: -0.01em;
    margin: 0 0 8px;
    color: var(--ink);
  }
  .sub {
    color: var(--ink-dim);
    font-size: 1rem;
    margin-bottom: 40px;
    max-width: 60ch;
  }
  form {
    display: flex;
    gap: 10px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 24px;
    margin-bottom: 40px;
  }
  input[type="text"] {
    flex: 1;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    color: var(--ink);
    font-family: var(--serif);
    font-size: 1.15rem;
    padding: 8px 2px;
    outline: none;
  }
  input[type="text"]:focus { border-bottom-color: var(--accent); }
  input[type="text"]::placeholder { color: var(--ink-dim); }
  button {
    background: var(--accent);
    color: #14150e;
    border: none;
    font-family: var(--mono);
    font-size: 0.8rem;
    padding: 0 20px;
    cursor: pointer;
    letter-spacing: 0.02em;
  }
  button:disabled { opacity: 0.4; cursor: default; }

  .plan {
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--ink-dim);
    margin-bottom: 32px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 18px;
  }
  .plan span { position: relative; padding-left: 14px; }
  .plan span::before {
    content: "";
    position: absolute; left: 0; top: 6px;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--line);
  }
  .plan span.done::before { background: var(--accent); }

  .aspect {
    border-top: 1px solid var(--line);
    padding: 28px 0;
  }
  .aspect h2 {
    font-size: 1.15rem;
    font-weight: 400;
    margin: 0 0 12px;
    color: var(--accent);
  }
  .aspect p { margin: 0 0 12px; color: var(--ink); }
  .aspect .sources {
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--ink-dim);
    line-height: 1.9;
  }
  .aspect .sources a { color: var(--ink-dim); }

  .final {
    margin-top: 40px;
    padding-top: 32px;
    border-top: 2px solid var(--accent);
  }
  .final h2 {
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--accent);
    letter-spacing: 0.04em;
    margin-bottom: 16px;
  }
  .final .body { white-space: pre-wrap; font-size: 1.05rem; }

  .status {
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--ink-dim);
  }
  .error { color: #d97757; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Derin Araştırma</h1>
    <p class="sub">Bir konu ya da olay yaz. Sistem konuyu alt başlıklara böler, her birini internetten araştırır ve sonunda hepsini birleştirip tek bir rapor halinde sunar.</p>

    <form id="form">
      <input id="topic" type="text" placeholder="Örn: Zodiac Katili" autocomplete="off" />
      <button id="submitBtn" type="submit">Araştır</button>
    </form>

    <div id="status" class="status"></div>
    <div id="plan" class="plan"></div>
    <div id="aspects"></div>
    <div id="final"></div>
  </div>

<script>
const API_BASE = "http://localhost:8000";

const form = document.getElementById("form");
const topicInput = document.getElementById("topic");
const submitBtn = document.getElementById("submitBtn");
const statusEl = document.getElementById("status");
const planEl = document.getElementById("plan");
const aspectsEl = document.getElementById("aspects");
const finalEl = document.getElementById("final");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const topic = topicInput.value.trim();
  if (!topic) return;

  submitBtn.disabled = true;
  statusEl.textContent = "Planlanıyor...";
  planEl.innerHTML = "";
  aspectsEl.innerHTML = "";
  finalEl.innerHTML = "";

  try {
    const res = await fetch(`${API_BASE}/api/research`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ topic }),
    });

    if (!res.ok || !res.body) {
      throw new Error(`Sunucu hatası: ${res.status}`);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      let lines = buffer.split("\n");
      buffer = lines.pop(); // son satır tamamlanmamış olabilir

      for (const line of lines) {
        if (!line.trim()) continue;
        handleEvent(JSON.parse(line));
      }
    }
  } catch (err) {
    statusEl.innerHTML = `<span class="error">Hata: ${err.message}</span>`;
  } finally {
    submitBtn.disabled = false;
  }
});

function handleEvent(evt) {
  if (evt.type === "plan") {
    statusEl.textContent = "Alt başlıklar araştırılıyor...";
    planEl.innerHTML = evt.aspects.map(t => `<span data-title="${t}">${t}</span>`).join("");
  } else if (evt.type === "aspect") {
    markPlanDone(evt.title);
    renderAspect(evt);
  } else if (evt.type === "final") {
    statusEl.textContent = "Tamamlandı.";
    renderFinal(evt.report);
  } else if (evt.type === "error") {
    statusEl.innerHTML = `<span class="error">${evt.message}</span>`;
  }
}

function markPlanDone(title) {
  const el = [...planEl.children].find(c => c.dataset.title === title);
  if (el) el.classList.add("done");
}

function renderAspect(evt) {
  const div = document.createElement("div");
  div.className = "aspect";
  const sources = (evt.sources || [])
    .map(s => `<a href="${s.url}" target="_blank" rel="noopener">${s.title}</a>`)
    .join(" · ");
  div.innerHTML = `
    <h2>${evt.title}</h2>
    <p>${evt.summary}</p>
    ${sources ? `<div class="sources">Kaynaklar: ${sources}</div>` : ""}
  `;
  aspectsEl.appendChild(div);
}

function renderFinal(report) {
  finalEl.innerHTML = `
    <div class="final">
      <h2>SONUÇ RAPORU</h2>
      <div class="body"></div>
    </div>
  `;
  finalEl.querySelector(".body").textContent = report;
}
</script>
</body>
</html>
